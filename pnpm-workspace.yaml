# pnpm 11 reads settings from here (the package.json "pnpm" field is no longer read).
allowBuilds:
  # migrate each package from the old onlyBuiltDependencies here as `name: true`
  "@scarf/scarf": false
  esbuild: true
  protobufjs: true
  sharp: true
minimumReleaseAge: 0
overrides:
  # GHSA-f88m-g3jw-g9cj — imagetools-core@6 pins sharp ^0.33.1; scope-capped to the vulnerable range
  "sharp@<0.35.0": "^0.35.3"
  # GHSA-pxg6-pf52-xh8x — @sveltejs/kit pins cookie ^0.6.0 even at latest; scope-capped to the vulnerable range
  "cookie@<0.7.0": "^0.7.2"
